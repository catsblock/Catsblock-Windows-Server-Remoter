name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VER: 26.1.10909125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VER" "cmake;3.22.1"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: deps
          key: deps-v5-static
          restore-keys: deps-v5-
      - name: Build OpenSSL and FreeRDP
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          set -e
          export NDK=$ANDROID_HOME/ndk/$NDK_VER
          export DEPS=$GITHUB_WORKSPACE/deps
          mkdir -p $DEPS
          cd /tmp
          curl -fsSL https://github.com/openssl/openssl/releases/download/openssl-3.0.15/openssl-3.0.15.tar.gz | tar xz
          cd openssl-3.0.15
          export ANDROID_NDK_ROOT=$NDK
          export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          ./Configure android-arm64 -D__ANDROID_API__=26 no-shared no-tests --prefix=$DEPS --openssldir=$DEPS/ssl --libdir=lib
          make -j4 build_libs
          make install_dev
          cd /tmp
          git clone --depth 1 --branch 3.10.3 https://github.com/FreeRDP/FreeRDP.git
          cd FreeRDP
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$DEPS \
            -DCMAKE_FIND_ROOT_PATH=$DEPS -DOPENSSL_ROOT_DIR=$DEPS \
            -DOPENSSL_USE_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_TESTING=OFF \
            -DWITH_CLIENT=OFF -DWITH_CLIENT_COMMON=ON -DWITH_CLIENT_CHANNELS=ON \
            -DCHANNEL_CLIPRDR=ON -DCHANNEL_CLIPRDR_CLIENT=ON \
            -DCHANNEL_RDPSND=ON -DCHANNEL_RDPSND_CLIENT=ON \
            -DCHANNEL_AUDIN=ON -DCHANNEL_AUDIN_CLIENT=ON \
            -DCHANNEL_RDPDR=ON -DCHANNEL_RDPDR_CLIENT=ON \
            -DCHANNEL_DRIVE=ON -DCHANNEL_DRIVE_CLIENT=ON \
            -DCHANNEL_DRDYNVC=ON -DCHANNEL_DRDYNVC_CLIENT=ON \
            -DCHANNEL_REMDESK=OFF -DCHANNEL_REMDESK_CLIENT=OFF \
            -DWITH_OPENSLES=ON \
            -DWITH_SERVER=OFF -DWITH_SHADOW=OFF -DWITH_PROXY=OFF \
            -DWITH_SAMPLE=OFF -DWITH_MANPAGES=OFF \
            -DWITH_SERVER_CHANNELS=OFF -DWITH_PLATFORM_SERVER=OFF -DWITH_X11=OFF \
            -DWITH_WAYLAND=OFF -DWITH_FFMPEG=OFF -DWITH_SWSCALE=OFF -DWITH_CAIRO=OFF \
            -DWITH_FUSE=OFF -DWITH_OPUS=OFF -DWITH_FAAC=OFF -DWITH_FAAD2=OFF \
            -DWITH_GSM=OFF -DWITH_LAME=OFF -DWITH_SOXR=OFF -DWITH_OPENH264=OFF \
            -DWITH_JPEG=OFF -DWITH_KRB5=OFF -DWITH_JSON_DISABLED=ON -DWITH_AAD=OFF \
            -DWITH_WEBVIEW=OFF -DWITH_CLIENT_SDL=OFF -DWITH_PCSC=OFF \
            -DWITH_INTERNAL_MD4=ON -DWITH_INTERNAL_MD5=ON -DWITH_INTERNAL_RC4=ON
          cmake --build build -j4
          cmake --install build
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-matched-key == ''
        with:
          path: deps
          key: deps-v5-static
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > release.keystore
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        run: gradle assembleDebug --stacktrace -PverCode=${{ github.run_number }} -PverName=1.0.${{ github.run_number }}
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WindowsServerRemoter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsServerRemoter-debug
          path: WindowsServerRemoter.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" WindowsServerRemoter.apk \
            --title "Version 1.0.${{ github.run_number }}" \
            --notes "Automatic build" \
            --target ${{ github.sha }}
